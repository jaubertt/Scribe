plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"scribe" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArguments.addAll("--username", "Jaubert_")
		}
		secondClient {
			client()
			configName = "Minecraft Client 2"
			runDirectory.set(file("run2"))
			programArguments.addAll("--username", "Player2")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	clientCompileOnly files("libs/modmenu-api-stub.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.base.archivesName.get()
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

def isICloudCopyName = { String name -> name ==~ /.+ \d+(\.[^.]+)?/ }
def isICloudCopy = { element -> element.relativePath.segments.any { isICloudCopyName(it) } }
def removeICloudCopies = { File root ->
	if (!root.isDirectory()) {
		return
	}
	def copies = []
	root.eachFileRecurse { file -> if (isICloudCopyName(file.name)) copies << file }
	copies.each { file -> file.isDirectory() ? file.deleteDir() : file.delete() }
}

sourceSets.configureEach {
	java.exclude(isICloudCopy)
	resources.exclude(isICloudCopy)
}

tasks.withType(AbstractCopyTask).configureEach {
	exclude(isICloudCopy)
}

tasks.withType(ProcessResources).configureEach { task ->
	doLast { removeICloudCopies(task.destinationDir) }
}

tasks.withType(JavaCompile).configureEach { task ->
	doLast { removeICloudCopies(task.destinationDirectory.get().asFile) }
}

tasks.withType(AbstractArchiveTask).configureEach {
	exclude 'com/terraformersmc/**'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
